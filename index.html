<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prueba de autonomía INFLUWEB</title>
  <link rel="stylesheet" href="./styles.css" />
  <meta name="theme-color" content="#2563EB" />
</head>
<body>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>

  <header class="site-header" role="banner">
    <div class="container header-inner">
      <div class="brand" aria-label="INFLUWEB">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-text">INFLUWEB</span>
      </div>
      <div class="header-badge" aria-hidden="true">Prueba</div>
    </div>
  </header>

  <main id="contenido" class="main" role="main">
    <section class="hero" aria-label="Encabezado principal">
      <div class="container hero-inner">
        <div class="hero-copy">
          <h1 class="hero-title">Prueba de autonomía INFLUWEB</h1>
          <p class="hero-subtitle">Prueba completa de autonomía y publicación superada</p>
        </div>

        <div class="hero-card" role="region" aria-label="Resumen">
          <div class="card-row">
            <span class="dot" aria-hidden="true"></span>
            <span class="card-text">Web mínima y publicable</span>
          </div>
          <div class="card-row">
            <span class="dot" aria-hidden="true"></span>
            <span class="card-text">Responsive y sin dependencias externas</span>
          </div>
          <div class="card-row">
            <span class="dot" aria-hidden="true"></span>
            <span class="card-text">CSS y JS incluidos como archivos locales</span>
          </div>
        </div>
      </div>
    </section>

    <section class="footer-cta" aria-label="Acciones">
      <div class="container footer-cta-inner">
        <button id="btnDemo" class="btn" type="button">
          Ver confirmación
        </button>
        <p id="demoMsg" class="demo-msg" role="status" aria-live="polite"></p>
      </div>
    </section>
  </main>

  <footer class="site-footer" role="contentinfo">
    <div class="container footer-inner">
      <span>© <span id="year"></span> INFLUWEB</span>
      <span class="muted">Listo para publicar</span>
    </div>
  </footer>

  <script src="./script.js"></script>
</body>
</html>
